<svg xmlns="http://www.w3.org/2000/svg"
     width="1600" height="800" viewBox="0 0 1600 800">
  <title>মূল্যায়ন — কাজ হোক প্রমাণ</title>
  <desc>Transparent-background flat 2:1 logo with document and checkmark icon, Bengali wordmark and tagline.</desc>

  <!-- Icon -->
  <g transform="translate(75 120)">
    <path d="M0 0H285L405 120V560H0Z"
          fill="none" stroke="#101A72" stroke-width="30"
          stroke-linejoin="miter"/>
    <path d="M285 0V120H405" fill="#38577D"/>

    <!-- Document lines -->
    <path d="M70 180H245" stroke="#38577D" stroke-width="18"/>
    <path d="M70 235H275" stroke="#38577D" stroke-width="18"/>
    <path d="M70 290H225" stroke="#38577D" stroke-width="18"/>

    <!-- Checkmark -->
    <path d="M70 365L145 440L330 255"
          fill="none" stroke="#101A72" stroke-width="34"
          stroke-linecap="square" stroke-linejoin="miter"/>
  </g>

  <!-- Wordmark and tagline -->
  <g transform="translate(555 0)">
    <text x="0" y="365"
          font-family="'Noto Sans Bengali','Noto Sans Bengali UI',sans-serif"
          font-size="170" font-weight="700"
          fill="#101A72"
          textLength="900" lengthAdjust="spacingAndGlyphs">মূল্যায়ন</text>

    <line x1="0" y1="425" x2="900" y2="425"
          stroke="#101A72" stroke-width="8"/>

    <text x="0" y="545"
          font-family="'Noto Sans Bengali','Noto Sans Bengali UI',sans-serif"
          font-size="76" font-weight="400"
          fill="#38577D"
          textLength="650" lengthAdjust="spacingAndGlyphs">কাজ হোক প্রমাণ</text>
  </g>
</svg>
